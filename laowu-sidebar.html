      let match=text.match(/^已保存；新任务最多同时运行 (\d+) 个代理。$/);

      match=text.match(/^“(.+?)”没有启用的分组，请选择其他路线或先在设置页启用分组。$/);
      if(match)return `“${match[1]}” has no enabled groups. Choose another route or enable a group in Settings.`;
      match=text.match(/^(\d+) 分 (\d+) 秒$/);
      if(match)return `${match[1]}m ${match[2]}s`;
      match=text.match(/^(\d+) 秒$/);
      if(match)return `${match[1]}s`;
    }else{
      let match=text.match(/^Saved\. New tasks can run up to (\d+) agents at once\.$/);
      if(match)return `已保存；新任务最多同时运行 ${match[1]} 个代理。`;
      match=text.match(/^Only “(.+?)” is enabled\. Choose Auto or a specific group\.$/);
      if(match)return `仅启用“${match[1]}”，请选择 Auto 或具体分组。`;

      match=text.match(/^(\d+)m (\d+)s$/);
      if(match)return `${match[1]} 分 ${match[2]} 秒`;
      match=text.match(/^(\d+)s$/);
      if(match)return `${match[1]} 秒`;
    }
    for(const [source,target] of Object.entries(dictionary)){
      if((source.endsWith("：")||source.endsWith(":")||source.endsWith(" · ")||source.endsWith(" "))&&text.startsWith(source))return target+text.slice(source.length);
      if((source.startsWith("（")||source.startsWith("(")||source.startsWith(" "))&&text.endsWith(source))return text.slice(0,-source.length)+target;

  async function loadConfiguration() {
    const grid = document.getElementById("platform-grid");
    if(!grid) return;
    const pendingAutoSave=Boolean(routeAutoSaveTimer);
    if(routeAutoSaveTimer){clearTimeout(routeAutoSaveTimer);routeAutoSaveTimer=null;}
    grid.innerHTML = '<div class="config-loading">正在读取本地配置…</div>';
    try {
      if(pendingAutoSave){
        const saved=await saveRouteSettings({automatic:true});
        if(!saved){
          const status=document.getElementById("route-save-status");
          if(status)status.textContent="自动保存失败；刷新已取消，路线草稿已保留。请修复问题后重试保存。";
          if(activeView==="settings"&&grid.isConnected)renderConfiguration();
          return;
        }
      }
      await configurationWriteQueue;
      if(routeDraft&&routeDraftRevision!==savedRouteDraftRevision){
        const status=document.getElementById("route-save-status");
        if(status)status.textContent="存在未保存的路线草稿；刷新已取消，请先保存路线设置。";
        if(activeView==="settings"&&grid.isConnected)renderConfiguration();
        return;
      }
      keyMessages.clear();
      await fetchConfiguration({resetDraft:true});
      if(activeView==="settings") renderConfiguration();
    } catch(error) {
      if(activeView==="settings"&&grid.isConnected) grid.innerHTML=`<div class="config-empty">读取失败：${esc(error.message)}<br>点击右上角刷新重试</div>`;
    }
  }

  function cloneRoutes(routes) { return (routes||[]).map(route=>({...route,groups:(route.groups||[]).map(group=>({...group}))})); }

  async function fetchConfiguration({resetDraft=false}={}) {
    const revision=++configurationFetchRevision;
    const result = await rpc("tools/call",{name:"laowu_configuration_snapshot",arguments:{}});
    if(revision!==configurationFetchRevision)return configuration;
    const data = textOf(result);
    if(result?.isError||!data||!Array.isArray(data.platforms)) throw new Error("本地路线数据读取失败");
    configuration = data;
    if(resetDraft||routeDraft===null) {
      routeDraft=cloneRoutes(data.platforms);routeDraftRevision++;savedRouteDraftRevision=routeDraftRevision;
      if(resetDraft)routeSaveFailed=false;
    }
    return data;
  }

  function enqueueConfigurationWrite(work) {
    const operation=configurationWriteQueue.then(work,work);
    configurationWriteQueue=operation.catch(()=>{});
    return operation;
  }

  function markRouteDraftChanged(autoSave=false) {
    routeDraftRevision++;
    if(!autoSave)return;
    const status=document.getElementById("route-save-status");if(status)status.textContent="选择已更改，正在自动保存…";
    if(routeAutoSaveTimer)clearTimeout(routeAutoSaveTimer);
    routeAutoSaveTimer=setTimeout(()=>{routeAutoSaveTimer=null;saveRouteSettings({automatic:true});},250);
  }

  function routeModeLabel(route) {
    const groups=route.groups||[];
    const autoGroups=groups.filter(group=>group.enabled!==false&&group.auto).map(group=>(group.name||"").trim()||"未命名分组");
    const fallback=route.nativeCodexFallback===true;
    if(!autoGroups.length)return fallback?"Auto 顺序 · 原生子代理（直接运行）":groups.length?"手动分组":"尚未添加分组";
    const single=(route.autoMode||route.auto_mode)==="single";
    const steps=single?autoGroups.slice(0,1):autoGroups.slice();
    if(fallback)steps.push("原生子代理（分组重试耗尽后）");
    return `Auto ${single?"单组":"顺序"} · ${steps.join(" → ")}`;
  }

  async function loadCodexPermission() {
    const input=document.getElementById("allow-codex-launch");
    const status=document.getElementById("codex-permission-status");
    if(!input) return;
    input.disabled=true;
    try {
      const data=textOf(await rpc("tools/call",{name:"laowu_codex_permission",arguments:{action:"get"}}));
      if(!data||typeof data.allowCodexLaunch!=="boolean") throw new Error("调用权限数据格式无效");
      input.checked=data.allowCodexLaunch;
      status.textContent=data.storageError?`本地状态读取失败：${data.storageError}`:"设置仅控制 Codex 是否可通过本服务调用子代理。";
    } catch(error) { status.textContent=`读取失败：${short(error.message,120)}`; }
    finally { input.disabled=false; }
  }
  async function onCodexPermissionChange(event) {
    const input=event.currentTarget,status=document.getElementById("codex-permission-status");
    const desired=input.checked;
    input.disabled=true;status.textContent="正在保存…";
    try {
      const result=await rpc("tools/call",{name:"laowu_codex_permission",arguments:{action:"set",allowed:desired}});
      if(result?.isError) throw new Error(result.content?.[0]?.text||"保存失败");
      status.textContent=desired?"已允许 Codex 发起子代理。":"已禁止 Codex 发起和续聊子代理；已运行任务仍可停止。";
    } catch(error) { input.checked=!desired;status.textContent=`保存失败：${short(error.message,120)}`; }
    finally { input.disabled=false; }
  }

  async function writeRouteSettings(automatic=false) {
    const status=document.getElementById("route-save-status"),revision=routeDraftRevision;
    try {
      if(!routeDraft)throw new Error("路线数据尚未加载完成。");
      const payload=routeSettingsPayload();
      if(status)status.textContent=automatic?"正在自动保存路线设置…":"正在保存路线…";
      const result=await rpc("tools/call",{name:"laowu_save_routes",arguments:payload},60000);
      if(result?.isError)throw new Error(result.content?.[0]?.text||"保存失败");
      const saved=textOf(result);
      if(!saved||!Array.isArray(saved.platforms))throw new Error("服务器返回的路线数据无效。");
      configuration=saved;routeSaveFailed=false;savedRouteDraftRevision=revision;
      for(const providerId of payload.delete_provider_ids)pendingProviderDeletes.delete(providerId);
      const current=revision===routeDraftRevision;
      if(current)routeDraft=cloneRoutes(saved.platforms);
      if(activeView==="settings")renderConfiguration();
      if(status?.isConnected)status.textContent=current?(automatic?"路线设置已自动保存。":"路线设置已保存。"):"已保存之前的版本；新改动尚未保存。";
      return true;
    } catch(error) {
      routeSaveFailed=true;
      if(status?.isConnected)status.textContent=`保存失败：${short(error.message,160)}`;
      throw error;
    }
  }

      return false;

        configuration=snapshot;routeDraft=cloneRoutes(snapshot.platforms);routeDraftRevision++;savedRouteDraftRevision=routeDraftRevision;routeSaveFailed=false;
      });

        if(api_key.trim()){
          keyMessages.set(providerId,"分组已保存，正在加密保存密钥…");
          const keyStatus=Array.from(document.querySelectorAll("[data-key-status]")).find(item=>item.dataset.keyStatus===providerId);if(keyStatus)keyStatus.textContent="分组已保存，正在加密保存密钥…";
          const result=await rpc("tools/call",{name:"laowu_save_credential",arguments:{provider_id:providerId,api_key}},60000);
          if(result?.isError)throw new Error(result.content?.[0]?.text||"密钥保存失败");
          const saved=textOf(result),revision=routeDraftRevision;
          if(!saved||!Array.isArray(saved.platforms))throw new Error("服务器返回的路线数据无效。");
          configuration=saved;
          if(revision===routeDraftRevision)routeDraft=cloneRoutes(saved.platforms);
          if(unsavedKeys.get(providerId)===api_key)unsavedKeys.delete(providerId);
          keyMessages.set(providerId,unsavedKeys.has(providerId)?"已保存本次密钥；新输入的密钥尚未保存。":"分组和密钥已保存。");
        } else keyMessages.set(providerId,unsavedKeys.has(providerId)?"分组已保存；新输入的密钥尚未保存。":"分组已保存。");
      });
    } catch(error) { keyMessages.set(providerId,`${groupSaved?"分组已保存，但密钥保存失败":"保存失败"}：${short(error.message,160)}`); }
    finally { savingKeys.delete(providerId);if(activeView==="settings")renderConfiguration(); }
  }
  themeQuery.addEventListener?.("change",()=>{if(themeMode==="system"||(themeMode==="codex"&&!codexTheme))setTheme(themeMode,false);});
  try {
    const saved=localStorage.getItem("laowu-theme"); if(["codex","dark","light","system"].includes(saved)) themeMode=saved;
    const savedFontSize=Number(localStorage.getItem("laowu-font-size"));
    if(Number.isInteger(savedFontSize)&&savedFontSize>=11&&savedFontSize<=20){fontSize=savedFontSize;fontSizeMode="custom";}else{fontSize=codexFontSize;fontSizeMode="codex";}
    sidebarWidth=Number(localStorage.getItem(sidebarStorageKey))||250;
  } catch {}
  applyFontSize(fontSize,false);
  setTheme(themeMode,false);
  async function refresh() {
    const revision=++refreshRevision;
    refreshInFlight=true;
    const stamp=document.getElementById("stamp");
    const connection=document.getElementById("connection-dot");
    try {
      const result=await rpc("tools/call",{name:"laowu_activity_snapshot",arguments:{}});
      if(revision!==refreshRevision)return;
      const data=textOf(result);
      if(!data||!Array.isArray(data.activities)) throw new Error("活动数据格式无效");
      activities=data.activities;
      activityStorageError=data.storageError||"";
      if(!activities.some(a=>a.id===selectedId)) selectedId=activities.at(-1)?.id||null;
      render();
      connection.className="connection-dot online";
      stamp.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
      stamp.title="自动刷新中";
    } catch(error) {
      if(revision!==refreshRevision)return;
      connection.className="connection-dot offline";
      stamp.textContent="未连接";
      const detail=document.getElementById("detail");
        if(!activities.length) { detail.innerHTML=`<button class="detail-list-toggle" id="toggle-activity-list-detail" type="button" aria-expanded="false">展开列表</button><div class="empty"><strong>暂时无法读取活动</strong><span>${esc(error.message)} · 可点击刷新重试</span></div>`; bindActivityListToggle(); }
    } finally {
      if(revision===refreshRevision)refreshInFlight=false;
    }
  }
  function statusLabel(status) { return ({running:"运行中",completed:"已完成",failed:"失败",cancelled:"已停止",interrupted:"已中断"})[status]||"准备中"; }
  function formatDuration(seconds) {
    if(seconds==null) return "—";
    const wholeSeconds=Math.max(0,Math.floor(Number(seconds)));
    if(!Number.isFinite(wholeSeconds)) return "—";
    if(uiLanguage==="en")return wholeSeconds<60?`${wholeSeconds}s`:`${Math.floor(wholeSeconds/60)}m ${wholeSeconds%60}s`;
    return wholeSeconds<60?`${wholeSeconds} 秒`:`${Math.floor(wholeSeconds/60)} 分 ${wholeSeconds%60} 秒`;
  }
  function formatTime(value) {
    if(!value) return "—";
    const date=new Date(value);
    return Number.isNaN(date.getTime())?short(value,18):new Intl.DateTimeFormat(uiLanguage==="en"?"en-US":"zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(date);
  }
  function render() {
    if(activeView!=="activity") return;
    const list=document.getElementById("agents");
    document.getElementById("task-count").textContent=activities.length;
    let listHtml;
    if(!activities.length) listHtml='<div class="empty" style="min-height:110px">还没有代理任务</div>';
    else listHtml=activities.slice().reverse().map(a=>{
      const meta=[a.retained?translateUiText("已保留",uiLanguage):null,a.currentGroup?`<span data-user-copy>${esc(a.currentGroup)}</span>`:null,a.model?`<span data-user-copy>${esc(a.model)}</span>`:null].filter(Boolean).join(" · ")||esc(formatDuration(a.elapsedSeconds));
      return `<button class="agent ${a.id===selectedId?"active":""}" data-id="${esc(a.id)}"><span class="agent-head"><i class="dot ${esc(a.status)}"></i><span class="role">${esc(activityRoleLabel(a))}</span><span class="state state-${esc(a.status)}">${esc(statusLabel(a.status))}</span></span><span class="task-short">${esc(activityTitle(a))}</span><span class="task-meta">${meta}</span></button>`;
    }).join("");
    if(list._renderedHtml!==listHtml) {
      const existingIds=new Set(Array.from(list.querySelectorAll(".agent"),item=>item.dataset.id));
      list.innerHTML=listHtml;list._renderedHtml=listHtml;
      if(animationsEnabled)list.querySelectorAll(".agent").forEach((button,index)=>{if(!existingIds.has(button.dataset.id)){button.style.setProperty("--entry-delay",`${Math.min(index,6)*35}ms`);button.classList.add("activity-arrive");}});
    }
    list.querySelectorAll(".agent").forEach(button=>button.onclick=()=>{selectedId=button.dataset.id;render();});
    const activity=activities.find(a=>a.id===selectedId);
    const detail=document.getElementById("detail");
    if(!activity) { detail.innerHTML=`<button class="detail-list-toggle" id="toggle-activity-list-detail" type="button" aria-expanded="false">展开列表</button><div class="empty"><strong>敬待号令</strong><span>调用勘察员、审查员、验证员或编码员后，活动会显示在这里</span>${activityStorageError?`<span class="action-error">保留记录存储异常：${esc(activityStorageError)}</span>`:""}</div>`; bindActivityListToggle(); return; }
    const previousTranscript=detail.querySelector(".transcript");
    const activityChanged=previousTranscript?.dataset.activityId!==activity.id;
    if(expansionActivityId!==activity.id){expandedEventIds.clear();expansionActivityId=activity.id;}
    if(activityChanged) followTranscriptBottom=true;
    const elapsed=activity.elapsedSeconds??(activity.startedAt?Math.max(0,Math.floor((Date.now()-Date.parse(activity.startedAt))/1000)):null);
    const duration=formatDuration(elapsed);
    const chipValues=[[statusLabel(activity.status),false],[activity.currentGroup,true],[activity.model,true],[duration,false],[activity.retained?translateUiText("已保留",uiLanguage):null,false]].filter(([value])=>value);
    const chips=chipValues.map(([value,userCopy],index)=>`<span class="chip ${index===0?`state-${esc(activity.status)}`:index===2?"primary":""} ${userCopy?"user-copy":""}">${esc(value)}</span>`).join("");
    const events=activity.events||[];
    const visibleEventIds=new Set();
    events.forEach((e,index)=>{if(e.kind==="tool"||e.kind==="progress"||!e.kind)visibleEventIds.add(`${activity.id}:${e.eventId||e.id||e.time||index}`);});
    for(const id of expandedEventIds)if(!visibleEventIds.has(id))expandedEventIds.delete(id);
    const fullResult=completedTaskResults.get(activity.id);
    const eventSnapshot=JSON.stringify([uiLanguage,activityRoleLabel(activity),activity.role,activity.initiator,codexDisplayName,userDisplayName,events,fullResult]);
    const eventsChanged=activityChanged||previousTranscript?._eventSnapshot!==eventSnapshot;
    let rows=eventsChanged?events.map((e,eventIndex)=>{
      const kind=e.kind||"progress";
      let speaker=kind==="user"?userDisplayName:kind==="assistant"?activityRoleLabel(activity):"";
      let title=e.title||({user:"任务",assistant:"回复",tool:"工具调用",progress:"进度"}[kind]||"活动");
      if(kind==="user"&&title==="任务") { title=activity.initiator==="user"?"用户 调用":"Codex 调用"; speaker=""; }
      else if(kind==="user"&&title==="补充指令") { title="Codex 调用"; speaker=""; }
      else if(kind==="user"&&title==="回答") { title="用户 调用"; speaker=""; }
      if(kind==="progress"&&title==="状态") title="进度";
      const isProviderFailure=kind==="progress"&&title.endsWith("失败");
      const isEnd=activity.status==="completed"&&eventIndex===events.length-1&&kind==="progress"&&!isProviderFailure;
      if(isEnd) title="结束";
      const time=formatTime(e.time);
      const replyId=`${activity.id}:${e.eventId||e.id||e.time||eventIndex}`;
      const expanded=expandedReplyIds.has(replyId);
      const expandableEvent=kind==="tool"||kind==="progress";
      const eventExpanded=expandableEvent&&(isProviderFailure||expandedEventIds.has(replyId));
      const replyClass=kind==="assistant"&&!expanded?" reply-collapsed":"";
      const replyButton=kind==="assistant"?`<button type="button" class="reply-toggle" data-reply-id="${esc(replyId)}" hidden>${expanded?"收起":"展开"}</button>`:"";
      const eventButton=expandableEvent&&!isProviderFailure?`<button type="button" class="event-toggle" data-event-toggle="${esc(replyId)}" aria-expanded="${eventExpanded}" aria-label="${eventExpanded?"收起":"展开"}详情" title="${eventExpanded?"收起":"展开"}详情">${eventExpanded?"▾":"▸"}</button>`:"";
      return `<article class="entry ${esc(kind)}${isProviderFailure?" failure":""}${isEnd?" end":""}${expandableEvent&&!eventExpanded?" event-collapsed":""}" data-event-id="${esc(replyId)}"><div class="event-marker"></div><div class="event-content"><div class="entry-head"><span class="event-type">${esc(title)}</span>${eventButton}${speaker?`<span class="speaker" ${kind==="user"?"data-user-copy":""}>${esc(speaker)}</span>`:""}<time class="event-time" title="${esc(e.time||"")}">${esc(time)}</time></div><div class="bubble${replyClass}">${esc(e.text||"")}</div>${replyButton}</div></article>`;
    }).join(""):null;
    if(eventsChanged&&typeof fullResult==="string")rows+=`<article class="entry assistant"><div class="event-marker"></div><div class="event-content"><div class="entry-head"><span class="event-type">完整结果</span></div><div class="bubble">${esc(fullResult)}</div></div></article>`;
    const stopButton=["queued","running"].includes(activity.status)?`<button class="stop" id="stop-task">停止任务</button>`:"";
    const confirmingDelete=deleteConfirmId===activity.id;
    const resultButton=activity.hasFullResult?`<button type="button" class="record-action" data-activity-action="result">查看完整结果</button>`:"";
    const recordActionButtons=`${resultButton}<button type="button" class="record-action" data-activity-action="retain" ${activity.retained?"disabled":""}>${activity.retained?"已保留":"保留"}</button><button type="button" class="record-action" data-activity-action="delete" ${["queued","running"].includes(activity.status)?"disabled title=\"请先停止任务\"":""}>${confirmingDelete?"确认删除":"删除"}</button>${confirmingDelete?'<button type="button" class="record-action" data-cancel-delete>取消</button>':""}`;
    const masterRecallHtml=activity.status==="completed"&&activity.masterRecallAvailable===true?'<div class="permission-description">可继续对话：若结果未满足原任务目标，主控可通过 laowu_continue_task 提交具体修改。</div>':"";
    const storageError=activity.storageError||activityStorageError?`<div class="action-error">${esc(activity.storageError||activityStorageError)}</div>`:"";
    const metaHtml=`<section class="meta"><button class="detail-list-toggle" id="toggle-activity-list-detail" type="button" aria-expanded="false">展开列表</button><div class="eyebrow">代理活动</div><div class="title-row"><div class="title" title="${esc(activity.task)}">${esc(activityTitle(activity))}</div><div class="record-actions">${stopButton}${recordActionButtons}</div></div><div class="chips">${chips}</div>${masterRecallHtml}${storageError}<div class="action-error" id="activity-action-status" aria-live="polite"></div></section>`;
    if(activityChanged) {
      detail.innerHTML=`${metaHtml}<div class="transcript" data-activity-id="${esc(activity.id)}"><div class="timeline">${rows||'<div class="empty"><strong>暂无活动事件</strong><span>任务开始后，工具调用和代理回复会显示在这里</span></div>'}</div></div>`;
      bindActivityListToggle();if(animationsEnabled)detail.querySelectorAll(".entry[data-event-id]").forEach((entry,index)=>{entry.classList.add("marker-arrive");entry.style.setProperty("--marker-delay",Math.min(index,8)*32+"ms");});
    } else {
      detail.querySelector(".meta")?.replaceWith(new DOMParser().parseFromString(metaHtml,"text/html").body.firstElementChild);
      bindActivityListToggle();
      if(eventsChanged) { const previousEventIds=new Set(Array.from(detail.querySelectorAll(".entry[data-event-id]"),entry=>entry.dataset.eventId));detail.querySelector(".timeline").innerHTML=rows||'<div class="empty"><strong>暂无活动事件</strong><span>任务开始后，工具调用和代理回复会显示在这里</span></div>';if(animationsEnabled)detail.querySelectorAll(".entry[data-event-id]").forEach((entry,index)=>{if(!previousEventIds.has(entry.dataset.eventId)){entry.classList.add("marker-arrive");entry.style.setProperty("--marker-delay",Math.min(index,8)*32+"ms");}}); }
    }
    const transcript=detail.querySelector(".transcript");
    if(!transcript) return;
    transcript._eventSnapshot=eventSnapshot;
    detail.querySelector("#stop-task")?.addEventListener("click",async buttonEvent=>{
      const button=buttonEvent.currentTarget; button.disabled=true; button.textContent="正在停止…";
      try { await rpc("tools/call",{name:"cancel_subagent_task",arguments:{activity_id:activity.id}}); }
      catch { button.disabled=false; button.textContent="重试停止"; }
      finally { await refresh(); }
    });
    detail.querySelectorAll("[data-activity-action]").forEach(button=>button.addEventListener("click",async event=>{
      const action=event.currentTarget.dataset.activityAction;
      if(action==="delete"&&deleteConfirmId!==activity.id){deleteConfirmId=activity.id;render();return;}
      event.currentTarget.disabled=true;
      try {
        const result=await rpc("tools/call",{name:"laowu_activity_action",arguments:{activity_id:activity.id,action}});
        if(result?.isError)throw new Error(result.content?.[0]?.text||"操作失败");
        if(action==="result") {const data=await readTaskResult(activity.id,textOf(result),"laowu_activity_action");completedTaskResults.set(activity.id,data.result||"");render();return;}
        if(action==="delete"){completedTaskResults.delete(activity.id);deleteConfirmId=null;selectedId=null;}
        await refresh();
      } catch(error) {
        const status=detail.querySelector("#activity-action-status");if(status)status.textContent=short(error.message,160);
        event.currentTarget.disabled=false;
      }
    }));
    detail.querySelector("[data-cancel-delete]")?.addEventListener("click",()=>{deleteConfirmId=null;render();});
    detail.querySelectorAll("[data-reply-id]").forEach(button=>{
      const bubble=button.previousElementSibling;
      if(!bubble||button._replyToggleBound)return;
      button._replyToggleBound=true;
      button.addEventListener("click",()=>{const id=button.dataset.replyId;if(expandedReplyIds.has(id))expandedReplyIds.delete(id);else expandedReplyIds.add(id);syncReplyToggles();});
    });
    detail.querySelectorAll("[data-event-toggle]").forEach(button=>{
      if(button._eventToggleBound)return;
      button._eventToggleBound=true;
      button.addEventListener("click",()=>{
      const id=button.dataset.eventToggle;
      if(expandedEventIds.has(id))expandedEventIds.delete(id);else expandedEventIds.add(id);
      const entry=button.closest(".entry"),expanded=expandedEventIds.has(id);
      entry?.classList.toggle("event-collapsed",!expanded);
      button.textContent=expanded?"▾":"▸";button.setAttribute("aria-expanded",String(expanded));
      button.setAttribute("aria-label",`${expanded?"收起":"展开"}详情`);button.title=`${expanded?"收起":"展开"}详情`;
      });
    });
    requestAnimationFrame(syncReplyToggles);
    if(activityChanged||(eventsChanged&&followTranscriptBottom)) requestAnimationFrame(()=>{if(transcript.isConnected) transcript.scrollTop=transcript.scrollHeight;});
  }
  async function initialize() {
    bindCursorParticles();
    try {
      const init=await rpc("ui/initialize",{appInfo:{name:"wu he zhi zhong",version:"1.4.0"},appCapabilities:{availableDisplayModes:["fullscreen"]},protocolVersion:"2025-06-18"});
      setCodexHostContext(init?.hostContext||{});
      let serverPreferences=null,preferenceReadFailed=false;
      try {
        const result=await rpc("tools/call",{name:"laowu_theme_preference",arguments:{action:"get"}});
        if(result?.isError)throw new Error(result.content?.[0]?.text||"服务器拒绝读取外观设置");
        const preference=textOf(result);
        if(preference&&typeof preference==="object") serverPreferences=preference;
      } catch(error) { preferenceReadFailed=true;appearanceSaveError=`服务端外观设置读取失败，已保留本机偏好：${short(error.message,120)}`; }
      if(["codex","dark","light","system"].includes(serverPreferences?.theme)) themeMode=serverPreferences.theme;
      if(Number.isInteger(serverPreferences?.fontSize)) applyFontSize(serverPreferences.fontSize,false);
      if(Number.isInteger(serverPreferences?.sidebarWidth)) sidebarWidth=serverPreferences.sidebarWidth;
      if(!serverPreferences&&!preferenceReadFailed) try {
        const result=await rpc("tools/call",{name:"laowu_theme_preference",arguments:{action:"set",theme:themeMode,font_size:fontSizeMode==="codex"?null:fontSize,sidebar_width:sidebarWidth||250}});
        if(result?.isError)throw new Error(result.content?.[0]?.text||"服务器拒绝保存外观设置");
      } catch(error) { appearanceSaveError=`外观设置未保存到服务端：${short(error.message,120)}；本机显示仍可用。`; }
      setTheme(themeMode,false);
      applySidebarWidth(sidebarWidth||250);
      window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*");
      if(init?.hostContext?.availableDisplayModes?.includes("fullscreen")) {
        try { await rpc("ui/request-display-mode",{mode:"fullscreen"}); } catch {}
      }
        bindSidebarSplitter();
      bindActivityListToggle();
      document.getElementById("refresh").addEventListener("click",()=>activeView==="settings"?loadConfiguration():activeView==="profiles"?loadProfiles():refresh());
      document.querySelectorAll(".header-tab").forEach(button=>button.addEventListener("click",()=>button.dataset.view==="settings"?showSettingsView():button.dataset.view==="profiles"?showProfilesView():showActivityView()));
      await refresh();
      observeReplyContainer();
      setInterval(refresh,1800);
    } catch(error) {
      document.getElementById("stamp").textContent="未连接";
      document.getElementById("detail").innerHTML=`<button class="detail-list-toggle" id="toggle-activity-list-detail" type="button" aria-expanded="false">展开列表</button><div class="empty"><strong>无法连接 Codex</strong><span>${esc(error.message)}</span></div>`;
      bindActivityListToggle();
    }
  }
  document.addEventListener("change",event=>{
    if(event.target?.id!=="language-select")return;
    try { uiLanguage=saveLanguage(localStorage,event.target.value);languagePreferenceSaved=true; }
    catch { uiLanguage=event.target.value==="en"?"en":"zh-CN"; }
    if(userDisplayName==="用户"||userDisplayName==="User")userDisplayName=uiLanguage==="en"?"User":"用户";
    applyLanguage(document.body,uiLanguage);
    if(activeView==="activity")render();
  });
  initialize();
})();
</script>
