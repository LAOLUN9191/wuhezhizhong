<div class="shell">
  <header class="top"><div class="brand-wrap"><div class="brand">乌合之众</div></div><nav class="header-tabs" aria-label="页面"><button class="header-tab" data-view="activity" aria-pressed="true">活动</button><button class="header-tab" data-view="profiles" aria-pressed="false">子代理</button><button class="header-tab" data-view="settings" aria-pressed="false">设置</button></nav><div class="tools"><span class="connection"><i class="connection-dot" id="connection-dot"></i><span class="stamp" id="stamp">连接中…</span></span><button class="refresh" id="refresh" title="刷新活动" aria-label="刷新活动"><span class="refresh-icon" aria-hidden="true">↻</span><span>刷新</span></button></div></header>
  <div class="body" id="view-root">
    <nav class="list" aria-label="代理任务"><div class="list-header"><div><div class="list-kicker">本机任务记录</div><div class="section">子代理任务</div></div><div class="list-actions"><button class="small-action" id="toggle-activity-list" type="button" aria-expanded="true" title="收起会话列表">收起</button><button class="small-action" id="launch-task">发起任务</button><span class="count" id="task-count">0</span></div></div><div id="agents" class="agents"></div></nav>
    <div class="splitter" id="activity-splitter" role="separator" aria-label="调整任务列表宽度" aria-orientation="vertical" tabindex="0"></div>
    <main class="detail" id="detail"><button class="detail-list-toggle" id="toggle-activity-list-detail" type="button" aria-expanded="false">展开列表</button><div class="empty"><strong>正在连接乌合之众</strong><span>本机保留的任务记录会在这里显示</span></div></main>
  </div>
</div>
<script>
(() => {
  let nextId = 1;
  const pending = new Map();
  const completedTaskResults = new Map();
  let activities = [];
  let activityStorageError = "";
  let selectedId = null;
  let followTranscriptBottom = true;
  let activeView = "activity";
  let configuration = null;
  let configurationFetchRevision = 0;
  let routeDraft = null;
  let routeDraftRevision = 0;
  let savedRouteDraftRevision = 0;
  let routeSaveFailed = false;
  let routeAutoSaveTimer = null;
  let configurationWriteQueue = Promise.resolve();
  const pendingProviderDeletes = new Set();
  let pendingGroupDeleteProviderId = null;
  const addingGroups = new Set();
  const savingKeys = new Set();
  const keyMessages = new Map();
  const unsavedKeys = new Map();
  let profileSnapshot = null;
  let profileLoadRevision = 0;
  let profileError = "";
  let profileEditingId = null;
  let deleteConfirmId = null;
  let profileViewMode = "list";
  let launchViewRevision = 0;
  let profileDeleteConfirmId = null;
  let codexDisplayName = "Codex";
  let userDisplayName = "用户";
  let masterRecallDefault = true;
  try { masterRecallDefault = localStorage.getItem("laowu-master-recall-default") !== "false"; } catch {}
  let replyResizeObserver = null;
  const themeQuery = window.matchMedia("(prefers-color-scheme: light)");
  const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  let motionPreference=null;
  try{motionPreference=localStorage.getItem("laowu-animations");}catch{}
  let animationsEnabled=motionPreference==="on"||(motionPreference!=="off"&&!reducedMotionQuery.matches);
  if(!animationsEnabled)document.body.classList.add("motion-off");
  let themeMode = "codex";
  let appearanceSaveError = "";
  let appearanceSaveRevision = 0;
  let codexTheme = null;
  let codexVariables = {};
  let appliedCodexVariables = new Set();
  let codexHostContext = {};
  let fontSize = 13;
  let codexFontSize = 13;
  let fontSizeMode = "codex";
  let sidebarWidth = null;
  let sidebarResizeBound = false;
  let refreshRevision = 0;
  let refreshInFlight = false;
  const expandedReplyIds = new Set();
  const expandedEventIds = new Set();
  let expansionActivityId = null;
  const activityListStorageKey = "laowu-activity-list-collapsed";
  let activityListCollapsed = false;
  try { activityListCollapsed = localStorage.getItem(activityListStorageKey) === "true"; } catch {}
  const sidebarStorageKey = "laowu-sidebar-width";
  const hostVariableMap = {
    "--color-background-primary":["--bg"],"--color-background-secondary":["--panel"],
    "--color-background-tertiary":["--panel2"],"--color-border-primary":["--line"],
    "--color-border":["--line"],"--color-text-primary":["--text","--text-strong"],
    "--color-text-secondary":["--muted"],"--color-text-tertiary":["--text-secondary"],
    "--color-accent":["--accent"],"--color-accent-primary":["--accent"],
    "--accent-color":["--accent"],"--interactive-accent":["--accent"],"--color-brand-primary":["--accent"]
  };
  function sidebarBounds() {
    const min = 200;
    const max = Math.max(min + 40, Math.min(420, Math.floor(window.innerWidth * .48)));
    return {min,max};
  }
  function applySidebarWidth(width=sidebarWidth) {
    const {min,max}=sidebarBounds();
    sidebarWidth=Math.round(Math.max(min,Math.min(max,Number(width)||250)));
    document.getElementById("view-root")?.style.setProperty("--sidebar-width",`${sidebarWidth}px`);
    const splitter=document.getElementById("activity-splitter");
    if(splitter){splitter.setAttribute("aria-valuemin",String(min));splitter.setAttribute("aria-valuemax",String(max));splitter.setAttribute("aria-valuenow",String(sidebarWidth));}
  }
  function syncReplyToggles() {
    const detail=document.getElementById("detail");
    if(!detail)return;
    detail.querySelectorAll("[data-reply-id]").forEach(button=>{
      const bubble=button.previousElementSibling;
      if(!bubble)return;
      const replyId=button.dataset.replyId,expanded=expandedReplyIds.has(replyId);
      bubble.classList.remove("reply-collapsed");
      const fullHeight=bubble.getBoundingClientRect().height;
      bubble.classList.add("reply-collapsed");
      const collapsedHeight=bubble.getBoundingClientRect().height;
      const needsToggle=fullHeight>collapsedHeight+1;
      if(!needsToggle)expandedReplyIds.delete(replyId);
      bubble.classList.toggle("reply-collapsed",needsToggle&&!expanded);
      button.hidden=!needsToggle;
      button.textContent=expanded&&needsToggle?"收起":"展开";
      button.setAttribute("aria-expanded",String(expanded&&needsToggle));
    });
  }
  function observeReplyContainer() {
    const detail=document.getElementById("detail");
    if(!detail||typeof ResizeObserver==="undefined")return;
    if(!replyResizeObserver)replyResizeObserver=new ResizeObserver(()=>requestAnimationFrame(syncReplyToggles));
    replyResizeObserver.disconnect();
    replyResizeObserver.observe(detail);
  }
  window.addEventListener("resize",syncReplyToggles);
  function applyActivityListState() {
    const root=document.getElementById("view-root");
    if(!root) return;
    root.classList.toggle("list-collapsed",activityListCollapsed);
    root.querySelectorAll("#toggle-activity-list,#toggle-activity-list-detail").forEach(button=>{
      const expanded=!activityListCollapsed;
      button.setAttribute("aria-expanded",String(expanded));
      button.textContent=expanded?"收起":"展开列表";
      button.title=expanded?"收起会话列表":"展开会话列表";
    });
    requestAnimationFrame(syncReplyToggles);
  }
  function toggleActivityList() {
    activityListCollapsed=!activityListCollapsed;
    try { localStorage.setItem(activityListStorageKey,String(activityListCollapsed)); } catch {}
    applyActivityListState();
  }
  function bindActivityListToggle() {
    document.querySelectorAll("#toggle-activity-list,#toggle-activity-list-detail").forEach(button=>{ if(!button._bound){button._bound=true;button.addEventListener("click",toggleActivityList);} });
    applyActivityListState();
  }
  function saveSidebarWidth() { try { localStorage.setItem(sidebarStorageKey,String(sidebarWidth)); } catch {}; saveAppearance(); }
  function applyFontSize(value, persist=false) {
    fontSize=Math.max(11,Math.min(20,Number(value)||13));
    document.documentElement.style.setProperty("--font-scale",String(fontSize/13));
    const field=document.getElementById("font-size-value"); if(field)field.textContent=fontSizeMode==="codex"?`跟随 Codex · ${fontSize}px`:`${fontSize}px`;
    const slider=document.getElementById("font-size-slider"); if(slider)slider.value=String(fontSize);
    requestAnimationFrame(syncReplyToggles);
    if(persist) saveAppearance();
  }
  function saveAppearance() {
    try { localStorage.setItem("laowu-theme",themeMode);localStorage.setItem(sidebarStorageKey,String(sidebarWidth||250));if(fontSizeMode==="codex")localStorage.removeItem("laowu-font-size");else localStorage.setItem("laowu-font-size",String(fontSize)); } catch {}
    const revision=++appearanceSaveRevision;
    rpc("tools/call",{name:"laowu_theme_preference",arguments:{action:"set",theme:themeMode,font_size:fontSizeMode==="codex"?null:fontSize,sidebar_width:sidebarWidth||250}}).then(result=>{
      if(revision!==appearanceSaveRevision)return;
      if(result?.isError)throw new Error(result.content?.[0]?.text||"服务器拒绝保存外观设置");
      appearanceSaveError="";updateThemeHint();
    }).catch(error=>{
      if(revision!==appearanceSaveRevision)return;
      appearanceSaveError=`外观设置未保存到服务端：${short(error.message,120)}；本机显示仍可用。`;
      updateThemeHint();
    });
  }
  function bindSidebarSplitter() {

    grid.innerHTML = '<div class="config-loading">正在读取本地配置…</div>';
    try {
      if(pendingAutoSave){
        const saved=await saveRouteSettings({automatic:true});
        if(!saved){
          const status=document.getElementById("route-save-status");
          if(status)status.textContent="自动保存失败；刷新已取消，路线草稿已保留。请修复问题后重试保存。";
          if(activeView==="settings"&&grid.isConnected)renderConfiguration();
          return;
        }
      }
      await configurationWriteQueue;
      if(routeDraft&&routeDraftRevision!==savedRouteDraftRevision){
        const status=document.getElementById("route-save-status");
        if(status)status.textContent="存在未保存的路线草稿；刷新已取消，请先保存路线设置。";

    }
  }

  function cloneRoutes(routes) { return (routes||[]).map(route=>({...route,groups:(route.groups||[]).map(group=>({...group}))})); }

  async function fetchConfiguration({resetDraft=false}={}) {
    const revision=++configurationFetchRevision;
    const result = await rpc("tools/call",{name:"laowu_configuration_snapshot",arguments:{}});
    if(revision!==configurationFetchRevision)return configuration;
    const data = textOf(result);
    if(result?.isError||!data||!Array.isArray(data.platforms)) throw new Error("本地路线数据读取失败");
    configuration = data;
    if(resetDraft||routeDraft===null) {
      routeDraft=cloneRoutes(data.platforms);routeDraftRevision++;savedRouteDraftRevision=routeDraftRevision;
      if(resetDraft)routeSaveFailed=false;
    }
    return data;
  }

  function enqueueConfigurationWrite(work) {

    configurationWriteQueue=operation.catch(()=>{});

  async function writeRouteSettings(automatic=false) {
    const status=document.getElementById("route-save-status"),revision=routeDraftRevision;
    try {
      if(!routeDraft)throw new Error("路线数据尚未加载完成。");
      const payload=routeSettingsPayload();
      if(status)status.textContent=automatic?"正在自动保存路线设置…":"正在保存路线…";
      const result=await rpc("tools/call",{name:"laowu_save_routes",arguments:payload},60000);
      if(result?.isError)throw new Error(result.content?.[0]?.text||"保存失败");
      const saved=textOf(result);
      if(!saved||!Array.isArray(saved.platforms))throw new Error("服务器返回的路线数据无效。");
      configuration=saved;routeSaveFailed=false;savedRouteDraftRevision=revision;
      for(const providerId of payload.delete_provider_ids)pendingProviderDeletes.delete(providerId);
      const current=revision===routeDraftRevision;
      if(current)routeDraft=cloneRoutes(saved.platforms);
      if(activeView==="settings")renderConfiguration();
      if(status?.isConnected)status.textContent=current?(automatic?"路线设置已自动保存。":"路线设置已保存。"):"已保存之前的版本；新改动尚未保存。";
      return true;
    } catch(error) {
      routeSaveFailed=true;
      if(status?.isConnected)status.textContent=`保存失败：${short(error.message,160)}`;
      throw error;
    }
  }

  }

        const result=await rpc("tools/call",{name:"laowu_activity_action",arguments:{activity_id:activity.id,action}});
        if(result?.isError)throw new Error(result.content?.[0]?.text||"操作失败");
        if(action==="result") {const data=await readTaskResult(activity.id,textOf(result),"laowu_activity_action");completedTaskResults.set(activity.id,data.result||"");render();return;}
        if(action==="delete"){completedTaskResults.delete(activity.id);deleteConfirmId=null;selectedId=null;}
        await refresh();
      } catch(error) {
        const status=detail.querySelector("#activity-action-status");if(status)status.textContent=short(error.message,160);
        event.currentTarget.disabled=false;
      }
    }));
    detail.querySelector("[data-cancel-delete]")?.addEventListener("click",()=>{deleteConfirmId=null;render();});
    detail.querySelectorAll("[data-reply-id]").forEach(button=>{
      const bubble=button.previousElementSibling;
      if(!bubble||button._replyToggleBound)return;
      button._replyToggleBound=true;
      button.addEventListener("click",()=>{const id=button.dataset.replyId;if(expandedReplyIds.has(id))expandedReplyIds.delete(id);else expandedReplyIds.add(id);syncReplyToggles();});
    });
    detail.querySelectorAll("[data-event-toggle]").forEach(button=>{
      if(button._eventToggleBound)return;
      button._eventToggleBound=true;
      button.addEventListener("click",()=>{
      const id=button.dataset.eventToggle;
      if(expandedEventIds.has(id))expandedEventIds.delete(id);else expandedEventIds.add(id);
      const entry=button.closest(".entry"),expanded=expandedEventIds.has(id);
      entry?.classList.toggle("event-collapsed",!expanded);
      button.textContent=expanded?"▾":"▸";button.setAttribute("aria-expanded",String(expanded));
      button.setAttribute("aria-label",`${expanded?"收起":"展开"}详情`);button.title=`${expanded?"收起":"展开"}详情`;
      });
    });
    requestAnimationFrame(syncReplyToggles);
    if(activityChanged||(eventsChanged&&followTranscriptBottom)) requestAnimationFrame(()=>{if(transcript.isConnected) transcript.scrollTop=transcript.scrollHeight;});
  }
  async function initialize() {
    bindCursorParticles();
    try {
      const init=await rpc("ui/initialize",{appInfo:{name:"wu he zhi zhong",version:"1.4.0"},appCapabilities:{availableDisplayModes:["fullscreen"]},protocolVersion:"2025-06-18"});
      setCodexHostContext(init?.hostContext||{});
      let serverPreferences=null,preferenceReadFailed=false;
      try {
        const result=await rpc("tools/call",{name:"laowu_theme_preference",arguments:{action:"get"}});
        if(result?.isError)throw new Error(result.content?.[0]?.text||"服务器拒绝读取外观设置");
        const preference=textOf(result);
        if(preference&&typeof preference==="object") serverPreferences=preference;
      } catch(error) { preferenceReadFailed=true;appearanceSaveError=`服务端外观设置读取失败，已保留本机偏好：${short(error.message,120)}`; }
      if(["codex","dark","light","system"].includes(serverPreferences?.theme)) themeMode=serverPreferences.theme;
      if(Number.isInteger(serverPreferences?.fontSize)) applyFontSize(serverPreferences.fontSize,false);
      if(Number.isInteger(serverPreferences?.sidebarWidth)) sidebarWidth=serverPreferences.sidebarWidth;
      if(!serverPreferences&&!preferenceReadFailed) try {
        const result=await rpc("tools/call",{name:"laowu_theme_preference",arguments:{action:"set",theme:themeMode,font_size:fontSizeMode==="codex"?null:fontSize,sidebar_width:sidebarWidth||250}});
        if(result?.isError)throw new Error(result.content?.[0]?.text||"服务器拒绝保存外观设置");
      } catch(error) { appearanceSaveError=`外观设置未保存到服务端：${short(error.message,120)}；本机显示仍可用。`; }
      setTheme(themeMode,false);
      applySidebarWidth(sidebarWidth||250);
      window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*");
      if(init?.hostContext?.availableDisplayModes?.includes("fullscreen")) {
        try { await rpc("ui/request-display-mode",{mode:"fullscreen"}); } catch {}
      }
      document.getElementById("launch-task")?.addEventListener("click",()=>showLaunchView());
      bindSidebarSplitter();
      bindActivityListToggle();
      document.getElementById("refresh").addEventListener("click",()=>activeView==="settings"?loadConfiguration():activeView==="profiles"?loadProfiles():refresh());
      document.querySelectorAll(".header-tab").forEach(button=>button.addEventListener("click",()=>button.dataset.view==="settings"?showSettingsView():button.dataset.view==="profiles"?showProfilesView():showActivityView()));
      await refresh();
      observeReplyContainer();
      setInterval(refresh,1800);
    } catch(error) {
      document.getElementById("stamp").textContent="未连接";
      document.getElementById("detail").innerHTML=`<button class="detail-list-toggle" id="toggle-activity-list-detail" type="button" aria-expanded="false">展开列表</button><div class="empty"><strong>无法连接 Codex</strong><span>${esc(error.message)}</span></div>`;
      bindActivityListToggle();
    }
  }
  initialize();
})();
</script>
</body>
</html>
