name: Feature request / 功能建议
description: Describe the user problem and a concrete example.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
      description: 描述使用场景、当前做法和遇到的限制，请勿包含私有数据。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议方案
      description: 说明期望行为、可接受的替代方案，以及如何判断改进有效。
    validations:
      required: true
